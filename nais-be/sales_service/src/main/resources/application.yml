spring:
  application:
    name: sales_service
  neo4j:
    uri: bolt://neo4j:7687   # ime Docker servisa
    authentication:
      username: neo4j
      password: password

management:
  influx:
    metrics:
      export:
        enabled: true
        uri: http://localhost:8086
        api-version: v2
        bucket: nais_bucket
        org: nais_org
        token: ${INFLUXDB_TOKEN:my-super-secret-auth-token}